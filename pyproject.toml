[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "prismboost"
dynamic = ["version"]
authors = [
    { name = "Hamidreza Keshavarz", email = "hamid9@outlook.com" },
    { name = "Reza Rawassizadeh", email = "rezar@bu.edu" },
]
description = "PrismBoost: gradient boosting with SEFR oblique splits for classification and regression."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "classification",
    "regression",
    "gradient-boosting",
    "oblique-trees",
    "prismboost",
    "sefr",
    "sefrboost",
    "machine-learning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "scikit-learn>=1.2.2",
    "packaging>=21.0",
    "typing-extensions>=4.1.0; python_full_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.9.2",
]
examples = [
    "optuna>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/PrismBoost/PrismBoost"
Repository = "https://github.com/PrismBoost/PrismBoost"
Issues = "https://github.com/PrismBoost/PrismBoost/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/prismboost/__init__.py"
wheel.packages = ["src/prismboost"]
cmake.source-dir = "cpp"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]

[tool.ruff]
line-length = 100
